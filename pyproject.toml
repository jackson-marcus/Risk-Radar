[project]
name = "riskradar"
version = "0.1.0"
description = "Vendor risk management: time-decayed multi-category risk scoring, deterioration watchlist with trend detection, rule-based diligence gap analysis, and a cited due-diligence policy assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "plotly>=5.22",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "rank-bm25>=0.2",
    "typer>=0.12",
    "rich>=13",
    "streamlit>=1.36",
    "mlflow>=2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.uv]
# Broken ujson wheel on Windows boxes without msvcp140.dll.
override-dependencies = ["ujson; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskradar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download data or hit external services",
]

[tool.coverage.run]
source = ["src/riskradar"]
